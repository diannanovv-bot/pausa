<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PAUSA</title>
<meta name="theme-color" content="#071A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PAUSA">
<meta name="application-name" content="PAUSA">
<meta name="description" content="PAUSA helps university students rest on purpose: 3-minute resets after class and one bedtime they keep.">
<meta property="og:type" content="website">
<meta property="og:title" content="PAUSA · Reset your rhythm">
<meta property="og:description" content="3-minute resets by day, one bedtime by night. Add PAUSA to your home screen.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* PAUSA — dark-first. Layout: one iPhone-width column, view scroll area + bottom tab bar, sheets slide over. */
:root{
  color-scheme:dark;
  --bg:#071A33; --bg-2:#0A2140; --surface:#0D2647; --surface-2:#123157;
  --line:#1A3961; --line-2:#284C79;
  --fg:#EBF4FF; --fg-2:#B9CDE8; --muted:#7F99BD;
  --ice:#C4DDF7; --accent:#8FCBFF; --accent-ink:#062244;
  --accent-soft:rgba(143,203,255,.14); --accent-line:rgba(143,203,255,.42);
  --silver:#D3DFEF; --warn:#F2B48C; --warn-soft:rgba(242,180,140,.15);
  --scrim:rgba(3,12,28,.62); --shadow:0 18px 40px rgba(1,8,22,.5);
  --tab-bg:rgba(8,27,52,.94); --top-glow:#123A6B;
  --cur-1:rgba(66,138,232,.42); --cur-2:rgba(143,203,255,.22); --cur-3:rgba(28,84,170,.40); --accent-hi:#C2E3FF;
  --f-display:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-mono:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#EEF5FC; --bg-2:#E3EEF9; --surface:#FFFFFF; --surface-2:#E7F1FB;
    --line:#D3E2F2; --line-2:#BCD1EA;
    --fg:#0C2646; --fg-2:#33507A; --muted:#5E7898;
    --ice:#5B8EC6; --accent:#2B7DD1; --accent-ink:#FFFFFF;
    --accent-soft:rgba(43,125,209,.10); --accent-line:rgba(43,125,209,.34);
    --silver:#8CA1BE; --warn:#C0693A; --warn-soft:rgba(192,105,58,.10);
    --scrim:rgba(12,38,70,.35); --shadow:0 14px 34px rgba(20,70,130,.12);
    --tab-bg:rgba(246,250,254,.95); --top-glow:#D6E8F9;
    --cur-1:rgba(120,182,245,.38); --cur-2:rgba(178,222,255,.55); --cur-3:rgba(80,145,225,.20); --accent-hi:#56A3EE;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF5FC; --bg-2:#E3EEF9; --surface:#FFFFFF; --surface-2:#E7F1FB;
  --line:#D3E2F2; --line-2:#BCD1EA;
  --fg:#0C2646; --fg-2:#33507A; --muted:#5E7898;
  --ice:#5B8EC6; --accent:#2B7DD1; --accent-ink:#FFFFFF;
  --accent-soft:rgba(43,125,209,.10); --accent-line:rgba(43,125,209,.34);
  --silver:#8CA1BE; --warn:#C0693A; --warn-soft:rgba(192,105,58,.10);
  --scrim:rgba(12,38,70,.35); --shadow:0 14px 34px rgba(20,70,130,.12);
  --tab-bg:rgba(246,250,254,.95); --top-glow:#D6E8F9;
  --cur-1:rgba(120,182,245,.38); --cur-2:rgba(178,222,255,.55); --cur-3:rgba(80,145,225,.20); --accent-hi:#56A3EE;
}
/* Sleep goes one layer deeper: the open ocean at night */
.night-env{
  color-scheme:dark;
  --bg:#04102A; --bg-2:#071735; --surface:#0A1E40; --surface-2:#0F2A51;
  --line:#16335C; --line-2:#234670;
  --fg:#EBF4FF; --fg-2:#B9CDE8; --muted:#7F99BD;
  --ice:#C4DDF7; --accent:#8FCBFF; --accent-ink:#062244;
  --accent-soft:rgba(143,203,255,.14); --accent-line:rgba(143,203,255,.42);
  --silver:#D3DFEF; --warn:#F2B48C; --warn-soft:rgba(242,180,140,.15);
  --scrim:rgba(2,8,22,.65); --shadow:0 18px 40px rgba(0,5,18,.55);
  --tab-bg:rgba(5,17,40,.95); --top-glow:#0E2C5C;
  --cur-1:rgba(44,96,190,.38); --cur-2:rgba(120,180,255,.14); --cur-3:rgba(20,60,140,.42); --accent-hi:#C2E3FF;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;letter-spacing:-.005em;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .4s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.ic.xs{width:15px;height:15px}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;transition:background .4s}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 32px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view{position:relative;z-index:1;background:transparent}
/* Ocean current: slow-moving light under the surface */
#app::before,#onb::before,#session::before{content:"";position:absolute;inset:0 0 auto 0;height:520px;pointer-events:none;z-index:0;
  background:radial-gradient(55% 60% at 12% 0%,var(--cur-1) 0%,transparent 70%),radial-gradient(50% 55% at 92% 6%,var(--cur-2) 0%,transparent 72%),radial-gradient(75% 55% at 55% 58%,var(--cur-3) 0%,transparent 76%);
  background-size:150% 150%,150% 150%,160% 160%;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(180deg,#000 35%,transparent 100%);mask-image:linear-gradient(180deg,#000 35%,transparent 100%);
  animation:current 26s ease-in-out infinite alternate;transition:opacity .4s}
@keyframes current{0%{background-position:0% 0%,100% 0%,50% 100%}50%{background-position:35% 15%,70% 25%,30% 70%}100%{background-position:10% 30%,85% 10%,65% 55%}}
#onb>*,#session>*{position:relative;z-index:1}
.tabbar{position:relative;z-index:2}
.stack{display:grid;gap:30px}
.enter{animation:viewIn .32s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Type */
.label{font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.label.acc{color:var(--accent)}
.h-view{font-family:var(--f-ui);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.022em;margin:4px 0 0;text-wrap:balance}
.h-sec{font-family:var(--f-ui);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}
.body2{font-size:14px;color:var(--fg-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.num{font-variant-numeric:lining-nums tabular-nums}
p{margin:0}

/* View header */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.vh-l{min-width:0}
.greet{font-size:16px;font-weight:600;color:var(--fg-2);margin-top:2px;letter-spacing:-.01em}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);font-weight:600;font-size:14px;color:var(--fg);flex:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{color:var(--accent);font-size:14px;font-weight:500}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:18px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row-t{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
.row-s{font-size:13px;color:var(--muted)}
.chev{color:var(--muted)}
.ico-badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ico-badge.ice{background:color-mix(in srgb,var(--ice) 14%,transparent);color:var(--ice)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:var(--r-md);font-weight:600;font-size:17px;letter-spacing:-.01em;transition:transform .12s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent-hi) 0%,var(--accent) 55%,color-mix(in srgb,var(--accent) 80%,#2B6FD0) 100%);color:var(--accent-ink);box-shadow:0 8px 24px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--line-2)}
.btn.ghost{color:var(--fg-2);border:1px solid var(--line-2)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.42;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;font-size:12.5px;font-weight:500;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.chip.acc{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn);background:var(--warn-soft)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);letter-spacing:.01em}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--muted)}

/* Switch */
.switch{width:50px;height:30px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.switch[aria-checked="true"]{background:linear-gradient(135deg,var(--accent-hi),var(--accent))}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* Segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.18)}

/* Stepper */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper .sbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--fg-2)}
.stepper .sbtn:active{transform:scale(.94)}
.stepper .sval{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:lining-nums tabular-nums}

/* Hero score */
.hero{display:grid;gap:10px;text-align:left;width:100%}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.hero-num{display:flex;align-items:flex-end;gap:14px}
.big{font-family:var(--f-display);font-weight:700;font-size:78px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:lining-nums tabular-nums}
.hero-side{display:grid;gap:3px;padding-bottom:8px}
.hero .big,.commit .big{background:linear-gradient(180deg,var(--fg) 35%,var(--accent) 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.band-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.01em;color:var(--accent)}
.delta{font-size:12.5px;color:var(--muted)}
.delta.up{color:var(--accent)}
.delta.down{color:var(--warn)}
.rline{width:100%;height:auto;overflow:visible}
.rline text{font-family:var(--f-ui);font-weight:600;font-size:9.5px;fill:var(--muted)}
.rline .today-lab{fill:var(--fg)}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.05;transform:scale(1.9)}}
.hero-hint{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* Today strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip button{padding:12px 4px;text-align:left;display:grid;gap:2px}
.strip button+button{border-left:1px solid var(--line);padding-left:12px}
.strip .v{font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strip .v small{font-size:13px;color:var(--muted);font-weight:500}

/* Up next */
.next{position:relative;padding:20px;border-radius:var(--r-lg);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)) 0%,var(--surface) 60%);border:1px solid var(--accent-line);display:grid;gap:14px;overflow:hidden}
.next::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
.ifthen{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ifthen b{color:var(--fg);font-weight:700}
.ifthen .arrow{color:var(--accent)}
.next h3{margin:0;font-family:var(--f-ui);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.018em}
.next-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}

/* Timetable */
.tt{display:grid}
.tt-item{display:grid;grid-template-columns:62px 14px 1fr;gap:0 12px;align-items:start;min-height:64px;width:100%;text-align:left}
.tt-time{font-family:var(--f-mono);font-weight:600;font-size:12.5px;color:var(--fg-2);padding-top:2px;font-variant-numeric:tabular-nums}
.tt-time span{display:block;color:var(--muted);font-size:11px}
.tt-rail{position:relative;height:100%;display:flex;justify-content:center}
.tt-rail::before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.tt-item:first-child .tt-rail::before{top:7px}
.tt-item:last-child .tt-rail::before{bottom:auto;height:7px}
.tt-dot{position:relative;margin-top:4px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line-2)}
.tt-item.past .tt-dot{background:var(--line-2)}
.tt-item.now .tt-dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tt-body{padding-bottom:16px;min-width:0}
.tt-title{font-weight:600;font-size:16px;letter-spacing:-.01em}
.tt-item.past .tt-title{color:var(--fg-2)}
.tt-sub{font-size:12.5px;color:var(--muted)}
.tt-then{margin-top:7px}

/* Banner */
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--accent-soft);border:1px solid var(--accent-line);text-align:left;width:100%}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner .grow{flex:1;min-width:0}
.banner.install{background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));padding:12px 12px 12px 14px}
.app-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#123A6B,#04102A);color:#BFE0FF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.app-ic .ic{width:26px;height:26px;stroke-width:1.5}
.inst-step{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.inst-step+.inst-step{border-top:1px solid var(--line)}
.inst-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}

/* Check-in */
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.checkin button{height:64px;border-radius:var(--r-md);border:1px solid var(--line-2);display:grid;place-items:center;gap:2px;font-size:13.5px;font-weight:500;padding:8px 0}
.checkin button:active{background:var(--accent-soft);border-color:var(--accent-line)}

/* Modules */
.mod{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:left}
.mod+.mod{border-top:1px solid var(--line)}
.mod-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ice);flex:none}
.mod-ic .ic{width:24px;height:24px}
.feature{padding:22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);display:grid;gap:16px}
.feature-vis{height:120px;display:grid;place-items:center}

/* Progress bars */
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#2B6FD0),var(--accent-hi));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar.ice>i{background:var(--ice)}
.bar.pend>i{background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 7px)}
.comp{display:grid;gap:7px}
.comp-h{display:flex;justify-content:space-between;font-size:14px}
.comp-h .mono{font-size:12.5px;color:var(--fg-2)}

/* Sleep */
.commit{display:grid;gap:6px}
.commit .big{font-size:88px}
.sleep-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:var(--fg-2)}
.sleep-meta b{color:var(--fg);font-weight:500}
.lo-btn{height:58px;border-radius:18px;font-size:16.5px}
.tl text{font-family:var(--f-ui);font-weight:600;font-size:9.5px;fill:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 6px;justify-items:center}
.cal .wd{font-family:var(--f-ui);font-weight:600;font-size:11px;color:var(--muted)}
.cd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);border:1px solid var(--line)}
.cd.kept{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cd.grace{border:1.5px solid var(--accent);color:var(--accent)}
.cd.late{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.cd.today{border-style:dashed;border-color:var(--fg-2);color:var(--fg)}
.cd.future,.cd.none{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.wd-step{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;width:100%;text-align:left}
.wd-step+.wd-step{border-top:1px solid var(--line)}
.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;margin-top:1px;transition:all .2s}

#toast{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:90;background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg);padding:11px 16px;border-radius:14px;font-size:14px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}

.center{text-align:center}
.gap8{display:grid;gap:8px}.gap12{display:grid;gap:12px}.gap16{display:grid;gap:16px}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

.warnc{color:var(--warn)}

}

/* ============ Pausa Score ============ */
function isExam(k){const r=rec(k);return k===todayKey()?S.examMode:!!(r&&r.exam)}
const dayWin=k=>isExam(k)?45:20;
const dayTarget=k=>isExam(k)?2:(S.resetTarget||1);
function resetPts(n,t){if(t>=2)return n>=2?30:n>=1?15:0;return n>=2?30:n>=1?20:0}
function rhythmPts(k){
  const r=rec(k);if(!r||!r.lightsOut)return null;
  const d=Math.abs(relToBed(r.lightsOut,r.bed||S.bedtime)),w=dayWin(k);
  return d<=w?40:Math.max(0,Math.round(40*(1-(d-w)/70)));
}
function steadyPts(k){
  const r=rec(k);if(!r||!r.lightsOut)return null;
  const vals=[];
  for(let i=0;i<7;i++){const rr=rec(ymd(addDays(parseKey(k),-i)));if(rr&&rr.lightsOut&&!rr.grace)vals.push(Math.max(-60,Math.min(60,relToBed(rr.lightsOut,rr.bed||S.bedtime))))}
  let p;
  if(vals.length<3)p=8;else{const m=vals.reduce((a,b)=>a+b,0)/vals.length;const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-m)*(b-m),0)/vals.length);p=sd<=15?15:Math.max(0,Math.round(15*(1-(sd-15)/45)))}
  if(isComeback(k))p=Math.min(15,p+5);
  return p;
}
function isComeback(k){
  const pk=ymd(addDays(parseKey(k),-1)),pr=rec(pk),f=firstKey();
  if(!f||pk<f)return false;
  if(pr&&pr.grace)return false;
  const prevMiss=!pr||!pr.lightsOut||(rhythmPts(pk)||0)===0;
  const rp=rhythmPts(k);
  return prevMiss&&rp!==null&&rp>=20;
}
function avgComps(k){
  let n=0,a={rhythm:0,steady:0,wind:0};
  for(let i=1;i<=6;i++){const kk=ymd(addDays(parseKey(k),-i));const r=rec(kk);if(!r||r.grace)continue;const c=dayComp(kk);a.rhythm+=c.rhythm;a.steady+=c.steady;a.wind+=c.wind;n++}
  if(!n)return{rhythm:24,steady:8,wind:8};
  return{rhythm:Math.round(a.rhythm/n),steady:Math.round(a.steady/n),wind:Math.round(a.wind/n)};
}
function dayComp(k){
  const r=rec(k),isT=k===todayKey();
  const o={k,grace:!!(r&&r.grace),pending:[]};
  o.reset=resetPts(r?r.resets||0:0,dayTarget(k));
  let rh=rhythmPts(k),st=steadyPts(k);
  let wd=r&&r.windDown?15:((isT&&!(r&&r.lightsOut))?null:0);
  if(rh===null){if(isT)o.pending.push('rhythm');else rh=0}
  if(st===null){if(isT)o.pending.push('steady');else st=0}
  if(wd===null)o.pending.push('wind');
  if(o.pending.length){const a=avgComps(k);if(rh===null)rh=a.rhythm;if(st===null)st=a.steady;if(wd===null)wd=a.wind}
  o.rhythm=rh;o.steady=st;o.wind=wd;o.total=o.reset+rh+st+wd;
  return o;
}
function scoreAt(endK){
  const f=firstKey();if(!f)return null;
  const vals=[];let done=0;const tk=todayKey();
  for(let i=6;i>=0;i--){const k=ymd(addDays(parseKey(endK),-i));if(k<f||k>tk)continue;const c=dayComp(k);if(k!==tk)done++;if(c.grace)continue;vals.push(c.total)}
  if(done<3||!vals.length)return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function calibration(){const f=firstKey();if(!f)return 0;let n=0;for(let i=1;i<=7;i++){const k=ymd(addDays(now(),-i));if(k>=f)n++}return Math.min(3,n)}
function band(s){
  if(s==null)return{key:'cal',name:'Calibrating',line:'Learning your rhythm. Your score appears after 3 nights.'};
  if(s>=80)return{key:'rhythm',name:'In rhythm',line:'Rest is part of your routine now.'};
  if(s>=60)return{key:'tempo',name:'In tempo',line:'A steady rhythm with the odd miss.'};
  if(s>=40)return{key:'warm',name:'Warming up',line:'Habits are forming. Keep showing up.'};
  return{key:'off',name:'Offbeat',line:'Off the beat for now. One reset starts the way back.'};
}
function kept(k){const r=rec(k);if(!r)return false;if(r.grace)return true;const p=rhythmPts(k);return p!==null&&p>=20}
function streak(){let n=0;const t=now();let d=kept(todayKey())?0:-1;for(;n<500;d--){if(kept(ymd(addDays(t,d))))n++;else break}return n}
function bestStreak(){const f=firstKey();if(!f)return 0;let best=0,cur=0;for(let d=parseKey(f);ymd(d)<=todayKey();d=addDays(d,1)){if(kept(ymd(d))){cur++;best=Math.max(best,cur)}else cur=0}return best}
function graceAvailable(){for(let i=0;i<7;i++){const r=rec(ymd(addDays(now(),-i)));if(r&&r.grace)return false}return true}
function yesterdayMissed(){const k=yKey(),f=firstKey();if(!f||k<f)return false;const r=rec(k);if(r&&r.grace)return false;return !kept(k)}

function smooth(p){if(p.length<2)return'';let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function rhythmLine(endK,h=74){
  const W=320,H=h,top=8,bot=20,f=firstKey(),tk=todayKey();const id='rl'+(++gid);
  const xs=i=>10+i*(W-20)/6,ys=v=>top+(1-v/100)*(H-top-bot);

    pts.push({x:xs(idx),y:ys(v),grace:c.grace,today:k===tk,pend:c.pending.length>0});}

  return `<svg class="rline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rhythm line, daily scores for the last 7 days"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}${area?`<path d="${area}" fill="url(#${id})"/>`:''}${path?`<linearGradient id="${id}s" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="var(--ice)" stop-opacity=".55"/><stop offset="1" stop-color="var(--accent)"/></linearGradient><path d="${path}" fill="none" stroke="url(#${id}s)" stroke-width="2.4" stroke-linecap="round"/>`:''}${marks}${labs.join('')}</svg>`;

      const thenChip=c.then?(done.includes(c.id)?`<span class="chip acc">${ic('check','xs')}${TYPES[c.then].name} done</span>`:`<span class="chip">then ${TYPES[c.then].name}</span>`):`<span class="chip ghost">${ic('plus','xs')}Add if-then</span>`;

    }).join('')+`</div>`;
  }
  h+=`</section>`;

  // Exam + tonight
  h+=`<section class="group">
    <div class="row"><span class="ico-badge ice">${ic('book','sm')}</span><div class="grow"><div class="row-t">Exam Week Mode</div><div class="row-s">${S.examMode?'On: 2 resets a day, ±45 min bedtime window, study sprints.':'Adjusts targets fairly during exams.'}</div></div><button class="switch" role="switch" aria-label="Exam Week Mode" aria-checked="${S.examMode}" data-act="exam"></button></div>
    <button class="row" data-act="tab" data-arg="sleep"><span class="ico-badge">${ic('moon','sm')}</span><div class="grow"><div class="row-t">Tonight · lights out ${S.bedtime}</div><div class="row-s">${r.lightsOut?'Recorded at '+r.lightsOut:'Wind-down '+windStart()+' · '+stakeTxt}</div></div>${ic('chev','sm chev')}</button>
  </section>`;
  if(S.sample)h+=`<p class="note">${ic('info','xs')}Prototype: earlier history, friends and campus data are sample data. Everything you do today is real and saved on this device.</p>`;

/* ============ RESET ============ */

      :`<p class="row-t">Sprint complete. Time to reset.</p><button class="btn pri block" data-act="sprint-reset">${ic('play','sm')}Take your 3-minute reset</button>`;}
    else body=`<p class="body2">50 minutes of focused study, then a 3-minute reset. Repeat. Built for exam weeks.</p><button class="btn sec block" data-act="sprint-start">${ic('sprint','sm')}Start 50-minute sprint</button>`;
    h+=`<section class="panel pad gap12"><div class="between"><h2 class="h-sec">Study sprint</h2><span class="pill">${ic('book','xs')}Exam Week</span></div>${body}</section>`;
  }

  h+=`<section class="gap12"><h2 class="h-sec">Today's sessions</h2>`;
  h+=ty.length?`<div class="group">`+ty.map((t,i)=>`<div class="row"><span class="ico-badge">${ic(TYPES[t].icon,'sm')}</span><div class="grow"><div class="row-t">${TYPES[t].long}</div><div class="row-s">Session ${i+1}${i<3?' · +10 pts':' · beyond daily points cap'}</div></div>${ic('check','sm acc')}</div>`).join('')+`</div>`
    :`<div class="panel pad"><p class="body2">No resets yet today. Your first one counts the most: it adds ${dayTarget(tk)>=2?15:20} points to today's score.</p></div>`;
  h+=`</section><p class="note">${ic('info','xs')}Up to 3 resets a day earn points, so the score rewards a habit, not a marathon.</p>`;

function fmtClock(s){s=Math.max(0,Math.ceil(s));return pad2(Math.floor(s/60))+':'+pad2(s%60)}
function miniVis(t){

  return `<svg viewBox="0 0 200 160" width="150" height="120" aria-hidden="true">${figure('pose-tl')}</svg>`;
}
function figure(){return `<g class="shoulders"><path d="M28 156C38 124 66 116 100 116s62 8 72 40" fill="none" stroke="var(--ice)" stroke-width="2" stroke-linecap="round"/></g><path d="M100 98v18" stroke="var(--ice)" stroke-width="2" stroke-linecap="round"/><g class="head"><circle cx="100" cy="66" r="28" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><g class="nose"><path d="M100 64v10" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></g></g>`}

/* ============ SLEEP ============ */
function vSleep(){
  const r=T(),tk=todayKey(),ub=(()=>{let d=toMin(S.bedtime)-nowMin();if(d<-240)d+=1440;return d})();
  const stake=S.stake&&S.stake.night===tk?S.stake:null;
  let h=`<header class="vh"><div class="vh-l"><div class="label">Tonight's commitment</div><h1 class="h-view">Sleep</h1></div><span class="pill">${ic('bars','xs')}${streak()}-night streak</span></header>`;
  h+=`<section class="commit"><span class="label">Lights out</span><div class="big">${S.bedtime}</div>
    <div class="sleep-meta"><span>Wake <b>${S.wake}</b></span><span>Window <b>${fmtDur(sleepWin())}</b></span><span>${r.lightsOut?'Recorded <b>'+r.lightsOut+'</b>':S.dayOffset?'Simulated day':(ub>0?'In <b>'+fmtDur(ub)+'</b>':'<b class="warnc">Past bedtime</b>')}</span></div></section>`;
  h+=r.lightsOut?`<div class="banner">${ic('check')}<div class="grow"><div class="row-t">Lights out recorded at ${r.lightsOut}</div><div class="row-s">${kept(tk)?'In rhythm tonight.':'Later than planned. Tomorrow is a fresh bar.'}</div></div></div>${S.sample?`<button class="btn sec block" data-act="advance">${ic('sun','sm')}Skip to tomorrow morning (demo)</button>`:''}`
    :`<button class="btn pri block lo-btn" data-act="lights-out">${ic('moon')}Lights out</button>`;
  h+=nightTimeline();

  // Bedtime selector
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">Your sleep window</h2><span class="meta">Pick times you can keep</span></div>
    <div class="panel pad gap16">
      <div class="gap8"><span class="label">Lights out</span><div class="stepper"><button class="sbtn" data-act="bed" data-arg="-15" aria-label="Earlier">${ic('minus','sm')}</button><span class="sval">${S.bedtime}</span><button class="sbtn" data-act="bed" data-arg="15" aria-label="Later">${ic('plus','sm')}</button></div></div>

      ${sleepWin()<360?`<p class="err">${ic('info','xs')}Under 6 hours. A later wake-up or earlier bedtime will be easier to keep.</p>`:sleepWin()>600?`<p class="err">${ic('info','xs')}Over 10 hours. Most people won't keep this on class days.</p>`:`<p class="meta">Changes apply from tonight. Past nights keep the bedtime they had.</p>`}
    </div></section>`;

  // Stake
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">Stake on tonight</h2><span class="meta">Optional</span></div><div class="panel pad gap12">`;
  if(stake&&stake.status==='active'){h+=`<div class="between"><div><div class="row-t">${stake.amount} points at stake</div><div class="row-s">Keep ${S.bedtime} ±${dayWin(tk)} min → +${stake.amount}. Miss → −${Math.round(stake.amount/2)}.</div></div>${ic('diamond','acc')}</div>${r.lightsOut?'':`<button class="btn ghost sm" data-act="unstake">Cancel stake</button>`}`}
  else if(stake){h+=`<p class="row-t">${stake.status==='won'?'Stake won: +'+stake.amount+' points':'Stake lost: −'+Math.round(stake.amount/2)+' points'}</p><p class="body2">Stakes reset each night.</p>`}
  else if(r.lightsOut){h+=`<p class="body2">Tonight is already recorded. You can stake again tomorrow.</p>`}
  else{h+=`<p class="body2">Put points on keeping your bedtime. A miss costs only half, so one bad night never wipes you out.</p><div class="seg" role="group" aria-label="Stake amount">${[25,50,100].map(a=>`<button data-act="stake-amt" data-arg="${a}" aria-pressed="${(S._stakeAmt||50)===a}">${a} pts</button>`).join('')}</div>
    <button class="btn sec block" data-act="stake" ${S.points<(S._stakeAmt||50)?'disabled':''}>${ic('diamond','sm')}Stake ${(S._stakeAmt||50)} points</button>${S.points<(S._stakeAmt||50)?`<p class="err">${ic('info','xs')}You have ${S.points} points. Pick a smaller stake.</p>`:`<p class="meta">Balance ${S.points} points</p>`}`}
  h+=`</div></section>`;

  // Wind-down routine
  const wd=r.wd||{};const steps=[['close','Close the study tabs','Save your work and write tomorrow\'s first task.'],['phone','Phone on charge, across the room','Out of reach makes "one more video" harder.'],['dim','Lights low, screen warm','Dim the room and switch on night colours.'],['breathe','One minute of slow breathing','Breathe out longer than you breathe in.']];
  const nDone=steps.filter(s=>wd[s[0]]).length;
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">Wind-down</h2><span class="meta mono">${windStart()}–${S.bedtime}</span></div>
    <div class="group"><div class="row"><span class="ico-badge ice">${ic('bell','sm')}</span><div class="grow"><div class="row-t">Remind me at ${windStart()}</div><div class="row-s">30 minutes before lights out</div></div><button class="switch" role="switch" aria-label="Wind-down reminder" aria-checked="${S.windReminder}" data-act="wind-rem"></button></div></div>
    <div class="group">${steps.map(s=>`<button class="wd-step" role="checkbox" aria-checked="${!!wd[s[0]]}" data-act="wd" data-arg="${s[0]}"><span class="tick">${ic('check')}</span><div class="grow"><div class="row-t">${s[1]}</div><div class="row-s">${s[2]}</div></div></button>`).join('')}</div>
    <p class="meta">${r.windDown?'<span class="acc">Wind-down complete · +15 to tonight\'s score</span>':nDone+' of 4 done'}</p></section>`;

  // Me-time
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">Me-time block</h2><button class="switch" role="switch" aria-label="Me-time block" aria-checked="${S.meTime}" data-act="metime"></button></div>
    <div class="panel pad gap12"><p class="body2">Guilt-free time you plan before wind-down, so time for yourself stops coming out of your sleep.</p>
    ${S.meTime?`<div class="stepper"><button class="sbtn" data-act="me" data-arg="-15" aria-label="Earlier">${ic('minus','sm')}</button><div class="center"><span class="sval" style="font-size:30px">${S.meStart}–${windStart()}</span><div class="meta">${fmtDur(Math.max(0,toMin(windStart())-toMin(S.meStart)))} for you</div></div><button class="sbtn" data-act="me" data-arg="15" aria-label="Later">${ic('plus','sm')}</button></div>`:'<p class="meta">Off. Turn it on to plan your evening.</p>'}</div></section>`;

  // Grace
  const gA=graceAvailable(),yM=yesterdayMissed();
  h+=`<section class="panel pad gap12"><div class="flex">${ic('shield','acc')}<h2 class="h-sec">Grace Night</h2></div>
    <p class="body2">One night a week can slip without breaking your streak. It's excluded from your Pausa Score, so a birthday or a deadline doesn't cost you.</p>
    ${yM&&gA?`<button class="btn pri block" data-act="grace">Use Grace Night for last night</button>`:`<span class="pill ${gA?'':'mute'}">${gA?'1 available this week':'Used this week · back in '+graceBack()+' days'}</span>`}</section>`;

  // Calendar
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">Consistency</h2><span class="meta">Last 4 weeks</span></div>${calendar()}</section>`;
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">This week</h2><span class="meta">Lights out vs ${S.bedtime}</span></div><div class="panel pad">${weekChart()}</div></section>`;
  return h;
}
function graceBack(){for(let i=0;i<7;i++){const r=rec(ymd(addDays(now(),-i)));if(r&&r.grace)return 7-i}return 0}
function nightTimeline(){
  const W=320,H=74,start=20*60,span=12*60;const x=m=>{let d=m-start;if(d<0)d+=1440;return 8+(d/span)*(W-16)};
  const bed=toMin(S.bedtime),wake=toMin(S.wake),ws=bed-30,me=toMin(S.meStart);
  const seg=(a,b,y,h,fill,op)=>{const xa=x(a),xb=x(b);return xb>xa?`<rect x="${xa}" y="${y}" width="${xb-xa}" height="${h}" rx="${h/2}" fill="${fill}" fill-opacity="${op}"/>`:''};
  let g='';
  for(let hh=20;hh<=32;hh+=2){const mm=(hh%24)*60;g+=`<line x1="${x(mm)}" x2="${x(mm)}" y1="14" y2="50" stroke="var(--line)"/><text x="${x(mm)}" y="64" text-anchor="middle">${pad2(hh%24)}</text>`}
  return `<div class="panel pad gap12"><span class="label">Your evening</span><svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evening timeline">${g}
    ${S.meTime?seg(me,ws,22,8,'var(--ice)',.55):''}${seg(ws,bed,22,8,'var(--accent)',.35)}${seg(bed,wake,20,12,'var(--accent)',.9)}
    <circle cx="${x(bed)}" cy="26" r="4" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/></svg>
    <div class="legend">${S.meTime?'<span><i style="background:var(--ice)"></i>Me-time</span>':''}<span><i style="background:var(--accent);opacity:.45"></i>Wind-down</span><span><i style="background:var(--accent)"></i>Sleep window</span></div></div>`;
}
function calendar(){
  const t=now(),f=firstKey(),tk=todayKey();const end=addDays(t,6-wdi(t)),startD=addDays(end,-27);
  let h=`<div class="panel pad gap12"><div class="cal">`+WD.map(d=>`<span class="wd">${d[0]}</span>`).join('');
  for(let i=0;i<28;i++){const d=addDays(startD,i),k=ymd(d),r=rec(k);let c='none';
    if(k>tk)c='future';else if(k===tk)c=r&&r.lightsOut?(kept(k)?'kept':'late'):'today';else if(f&&k>=f){c=r&&r.grace?'grace':kept(k)?'kept':'late'}
    h+=`<span class="cd ${c}" title="${k}">${d.getDate()}</span>`}
  return h+`</div><div class="legend"><span><i style="background:var(--accent)"></i>In rhythm</span><span><i style="border:1.5px solid var(--accent)"></i>Grace</span><span><i style="background:var(--warn)"></i>Late or missed</span></div></div>`;
}
function weekChart(){
  const W=320,H=150,l=34,rr=8,top=10,bot=24;const tk=todayKey();
  const lo=-60,hi=120;const y=v=>top+(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*(H-top-bot);
  const w=dayWin(tk);
  let g=`<rect x="${l}" y="${y(-w)}" width="${W-l-rr}" height="${y(w)-y(-w)}" fill="var(--accent)" fill-opacity=".1"/>`;
  [-60,0,60,120].forEach(v=>{g+=`<line x1="${l}" x2="${W-rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'':'stroke-dasharray="2 4"'}/><text x="${l-6}" y="${y(v)+3}" text-anchor="end">${v===0?S.bedtime:(v>0?'+':'')+v+'m'}</text>`});
  const cw=(W-l-rr)/7;
  for(let i=6;i>=0;i--){const d=addDays(now(),-i),k=ymd(d),r=rec(k),idx=6-i,cx=l+cw*idx+cw/2;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" ${k===tk?'style="fill:var(--fg)"':''}>${WD[wdi(d)].slice(0,2)}</text>`;
    if(r&&r.lightsOut){const v=relToBed(r.lightsOut,r.bed||S.bedtime);const ok=kept(k);g+=`<line x1="${cx}" x2="${cx}" y1="${y(0)}" y2="${y(v)}" stroke="${ok?'var(--accent)':'var(--warn)'}" stroke-width="1.5" stroke-opacity=".5"/><circle cx="${cx}" cy="${y(v)}" r="5" fill="${ok?'var(--accent)':'var(--warn)'}"/>${v>hi?`<text x="${cx}" y="${y(hi)-8}" text-anchor="middle">+${v}</text>`:''}`}
    else if(r&&r.grace)g+=`<circle cx="${cx}" cy="${y(0)}" r="5" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;
    else g+=`<circle cx="${cx}" cy="${y(0)}" r="2" fill="var(--line-2)"/>`;}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lights-out times this week compared with bedtime">${g}</svg><p class="meta" style="margin-top:8px">Shaded band: your ±${w} min window. Above the line means later than planned.</p>`;
}

/* ============ PROGRESS ============ */
function vProgress(){
  const tk=todayKey(),sc=scoreAt(tk),b=band(sc);
  let h=`<header class="vh"><div class="vh-l"><div class="label">Your rhythm over time</div><h1 class="h-view">Progress</h1></div><button class="btn sm sec" data-act="report">${ic('share','xs')}Weekly report</button></header>`;

  h+=`<section class="gap16"><div class="between"><div><span class="label">Pausa Score</span><div class="flex" style="align-items:flex-end;gap:12px"><span class="big" style="font-size:64px">${sc==null?'–':sc}</span><span class="band-name" style="padding-bottom:6px">${b.name}</span></div></div></div>
    <div class="gap12">${[['Rhythm','rhythm',40,'Lights out near your bedtime'],['Reset','reset',30,'Daytime micro-breaks'],['Wind-down','wind',15,'Routine before bed'],['Steadiness','steady',15,'Same time, night after night']].map(c=>`<div class="comp"><div class="comp-h"><span>${c[0]} <span class="meta">· ${c[3]}</span></span><span class="mono">${comps[c[1]]}/${c[2]}</span></div><div class="bar"><i style="width:${comps[c[1]]/c[2]*100}%"></i></div></div>`).join('')}</div>
    <p class="meta">7-day averages. Pausa Score reflects your habits, not a medical measurement.</p></section>`;
  // Trend
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">Score trend</h2><span class="meta">14 days</span></div><div class="panel pad">${trendChart()}</div></section>`;
  // KPIs
  const k=kpis();
  h+=`<section class="gap12"><h2 class="h-sec">This week</h2><div class="panel pad gap16"><div class="kpis">
    <div class="kpi"><span class="label">Nights</span><span class="v">${k.nights}<small>/${k.nightsOf}</small></span><span class="meta">in rhythm</span></div>
    <div class="kpi"><span class="label">Resets</span><span class="v">${k.resets}</span><span class="meta">sessions</span></div>
    <div class="kpi"><span class="label">Streak</span><span class="v">${streak()}</span><span class="meta">best ${bestStreak()}</span></div></div>
    <div class="hr"></div>${resetBars()}</div></section>`;
  // Insight
  const ins=wakeInsight();
  if(ins)h+=`<section class="panel pad gap8"><span class="label">Pattern · self-reported</span><p style="font-family:var(--f-ui);font-weight:600;font-size:19px;line-height:1.35;letter-spacing:-.015em">${ins}</p><p class="meta">From your morning check-ins. A pattern in your own answers, not a measurement.</p></section>`;
  // Achievements
  const ach=achievements();const got=ach.filter(a=>a.got).length;
  h+=`<section class="gap12"><div class="sec-h"><h2 class="h-sec">Achievements</h2><span class="meta">${got} of ${ach.length}</span></div><div class="panel pad"><div class="badges">${ach.map(a=>`<button class="badge ${a.got?'got':''}" data-act="badge" data-arg="${a.id}">${medal(a)}<span class="badge-n">${a.name}</span></button>`).join('')}</div></div></section>`;
  // Rewards
  h+=rewardsSection();
  return h;
}
function weekComps(){const a={rhythm:0,reset:0,wind:0,steady:0};let n=0;const f=firstKey();for(let i=0;i<7;i++){const k=ymd(addDays(now(),-i));if(!f||k<f)continue;const c=dayComp(k);if(c.grace)continue;a.rhythm+=c.rhythm;a.reset+=c.reset;a.wind+=c.wind;a.steady+=c.steady;n++}if(!n)return a;for(const x in a)a[x]=Math.round(a[x]/n);return a}
function kpis(){let nights=0,of=0,resets=0;const f=firstKey();for(let i=0;i<7;i++){const k=ymd(addDays(now(),-i)),r=rec(k);if(r)resets+=r.resets||0;if(i===0&&!(r&&r.lightsOut))continue;if(!f||k<f)continue;of++;if(kept(k))nights++}return{nights,nightsOf:of,resets}}
function trendChart(){
  const W=320,H=150,l=8,rr=40,top=10,bot=22;const pts=[];
  for(let i=13;i>=0;i--){const k=ymd(addDays(now(),-i));const s=scoreAt(k);pts.push({i:13-i,s,d:addDays(now(),-i)})}
  const x=i=>l+i*(W-l-rr)/13,y=v=>top+(1-v/100)*(H-top-bot);
  let g='';[['Offbeat',20],['Warming up',50],['In tempo',70],['In rhythm',90]].forEach(([n,v])=>{});
  [40,60,80].forEach(v=>{g+=`<line x1="${l}" x2="${W-rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-rr+6}" y="${y(v)+3}">${v}</text>`});
  g+=`<text x="${W-rr+6}" y="${y(90)+3}" style="fill:var(--accent)">rhythm</text><text x="${W-rr+6}" y="${y(70)+3}">tempo</text>`;
  const valid=pts.filter(p=>p.s!=null);
  if(valid.length<2)return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<text x="${(W-rr)/2}" y="${H/2}" text-anchor="middle">Your trend appears after a few nights</text></svg>`;
  const P2=valid.map(p=>[x(p.i),y(p.s)]);const path=smooth(P2);const id='tg'+(++gid);
  const last=valid[valid.length-1];
  [0,7,13].forEach(i=>{const d=pts[i].d;g+=`<text x="${x(i)}" y="${H-5}" text-anchor="${i===0?'start':i===13?'end':'middle'}">${i===13?'Today':d.getDate()+' '+MON[d.getMonth()]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pausa Score over 14 days"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".2"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${g}<path d="${path} L${P2[P2.length-1][0]},${H-bot} L${P2[0][0]},${H-bot}Z" fill="url(#${id})"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(last.i)}" cy="${y(last.s)}" r="4.5" fill="var(--accent)"/><text x="${x(last.i)-8}" y="${y(last.s)-9}" text-anchor="end" style="fill:var(--fg);font-size:11px">${last.s}</text></svg>`;
}
function resetBars(){
  const W=320,H=96,top=12,bot=18;const vals=[];for(let i=6;i>=0;i--){const d=addDays(now(),-i),r=rec(ymd(d));vals.push({n:r?Math.min(3,r.resets||0):0,d,t:dayTarget(ymd(d))})}
  const bw=(W)/7,y=v=>top+(1-v/3)*(H-top-bot);
  let g=`<line x1="0" x2="${W}" y1="${y(S.resetTarget||1)}" y2="${y(S.resetTarget||1)}" stroke="var(--ice)" stroke-dasharray="3 3"/><text x="${W}" y="${y(S.resetTarget||1)-4}" text-anchor="end">target</text>`;
  vals.forEach((v,i)=>{const cx=i*bw+bw/2,hgt=Math.max(2,(H-top-bot)-(y(v.n)-top));g+=`<rect x="${cx-9}" y="${H-bot-hgt}" width="18" height="${hgt}" rx="4" fill="${v.n>=v.t?'var(--accent)':'var(--line-2)'}"/><text x="${cx}" y="${H-4}" text-anchor="middle">${'MTWTFSS'[wdi(v.d)]}</text>`});
  return `<div class="gap8"><span class="label">Resets per day</span><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resets per day, last 7 days">${g}</svg></div>`;
}
function wakeInsight(){
  let good=0,goodF=0,bad=0,badF=0;Object.keys(S.history).forEach(k=>{const r=S.history[k];if(!r.wake||!r.lightsOut)return;if(kept(k)){good++;if(r.wake==='fresh')goodF++}else{bad++;if(r.wake==='fresh')badF++}});
  if(good<3)return null;
  return `On nights you were in rhythm, you woke up <span class="acc">fresh</span> ${goodF} of ${good} times${bad?`; on the other nights, ${badF} of ${bad}.`:'.'}`;
}
function achievements(){
  const H=S.history,ks=Object.keys(H).sort();
  const total=ks.reduce((a,k)=>a+(H[k].resets||0),0);
  const triad=ks.some(k=>{const t=H[k].types||[];return['breath','eyes','neck'].every(x=>t.includes(x))});
  const cb=ks.some(k=>isComeback(k));
  const checks=ks.filter(k=>H[k].wake).length;
  return[
    {id:'first',name:'First Rest',desc:'Complete your first 3-minute reset.',got:total>=1,g:'g_rest'},
    {id:'triad',name:'Triad',desc:'Breath, Eyes and Neck in a single day.',got:triad,g:'g_triad'},
    {id:'seven',name:'Seven Bars',desc:'Keep your bedtime seven nights in a row.',got:bestStreak()>=7,g:'g_bars'},
    {id:'comeback',name:'Comeback',desc:'Back in rhythm the night after a miss. Consistency, not perfection.',got:cb,g:'g_repeat'},
    {id:'rhythm',name:'In Rhythm',desc:'Reach a Pausa Score of 80.',got:(S.peakScore||0)>=80,g:'g_wave'},
    {id:'exam',name:'Exam Survivor',desc:'Complete 5 resets with Exam Week Mode on.',got:(S.examResets||0)>=5,g:'g_fermata'},
    {id:'signal',name:'Morning Signal',desc:'Log 5 morning check-ins.',got:checks>=5,g:'g_sun'},
    {id:'pod',name:'Pod Player',desc:'Join a challenge with your pod.',got:!!S.podJoined,g:'g_pod'}
  ];
}
function medal(a,size=62){
  const ticks=Array.from({length:24},(_,i)=>{const an=i/24*Math.PI*2,r1=29,r2=i%6===0?25:27;return `<line x1="${31+Math.cos(an)*r1}" y1="${31+Math.sin(an)*r1}" x2="${31+Math.cos(an)*r2}" y2="${31+Math.sin(an)*r2}"/>`}).join('');
  const c=a.got?'var(--accent)':'var(--line-2)';
  return `<span class="medal" style="width:${size}px;height:${size}px"><svg class="ring" viewBox="0 0 62 62" aria-hidden="true"><circle cx="31" cy="31" r="22" fill="${a.got?'var(--accent-soft)':'none'}" stroke="${c}" stroke-width="1.2"/><g stroke="${c}" stroke-width="1" stroke-linecap="round">${ticks}</g></svg>${ic(a.got?a.g:'lock','')}</span>`;
}

function sheetScore(){
  const tk=todayKey(),sc=scoreAt(tk),b=band(sc),c=dayComp(tk),yk=yKey(),yr=rec(yk);
  let h=sheetHead('Pausa Score',sc==null?'Learning your rhythm':`${sc} · ${b.name}`);
  // band scale
  h+=`<div class="gap8"><div style="display:grid;grid-template-columns:40fr 20fr 20fr 20fr;gap:3px">${[['off','Offbeat'],['warm','Warming up'],['tempo','In tempo'],['rhythm','In rhythm']].map(x=>`<div style="height:6px;border-radius:3px;background:${x[0]===b.key?'var(--accent)':'var(--line-2)'}"></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:40fr 20fr 20fr 20fr;gap:3px" class="meta">${['Offbeat 0','Warming 40','Tempo 60','Rhythm 80'].map(x=>`<span style="font-size:11px">${x}</span>`).join('')}</div></div>`;
  if(sc==null)h+=`<p class="body2">Your score appears after 3 nights. Until then PAUSA learns your usual bedtime and reset pattern. ${calibration()}/3 nights so far.</p>`;
  // today components
  h+=`<div class="gap12"><span class="label">Today</span>${[['Rhythm','rhythm',40],['Reset','reset',30],['Wind-down','wind',15],['Steadiness','steady',15]].map(x=>{const p=c.pending.includes(x[1]);return `<div class="comp"><div class="comp-h"><span>${x[0]}${p?' <span class="meta">· estimated until lights out</span>':''}</span><span class="mono">${c[x[1]]}/${x[2]}</span></div><div class="bar ${p?'pend':''}"><i style="width:${c[x[1]]/x[2]*100}%"></i></div></div>`}).join('')}</div>`;
  // what moved
  const items=[];
  if(yr&&yr.grace)items.push(['shield','Grace Night used for last night','excluded']);
  else if(yr&&yr.lightsOut){const d=relToBed(yr.lightsOut,yr.bed||S.bedtime);items.push(['moon',`Lights out ${yr.lightsOut}, ${d===0?'right on time':Math.abs(d)+' min '+(d<0?'early':'late')}`,`Rhythm ${rhythmPts(yk)}/40`])}
  else if(rec(yk)||(firstKey()&&yk>=firstKey()))items.push(['moon','No lights out recorded last night','Rhythm 0/40']);
  if(isComeback(yk))items.push(['g_repeat','Comeback after a missed night','+5 steadiness']);
  const rs=(rec(tk)||{}).resets||0;items.push(['reset',rs?`${rs} reset${rs>1?'s':''} today`:'No reset yet today',`Reset ${c.reset}/30`]);
  if(c.pending.includes('rhythm'))items.push(['info','Tonight is still ahead','estimated from your week']);
  h+=`<div class="gap8"><span class="label">What moved your score</span><div class="group">${items.map(i=>`<div class="row">${ic(i[0],'sm muted')}<div class="grow"><div class="row-t" style="font-size:14.5px">${esc(i[1])}</div></div><span class="mono meta">${esc(i[2])}</span></div>`).join('')}</div></div>`;
  // one thing
  const r=T();let one,btn='';
  if((r.resets||0)<dayTarget(tk)){const nr=nextReset();one=nr.cls?`Take your ${TYPES[nr.type].name.toLowerCase()} reset after ${nr.cls.title} (${nr.cls.end}).`:`Take a 3-minute ${TYPES[nr.type].name.toLowerCase()} reset now.`;btn=`<button class="btn pri block" data-act="start-reset" data-arg="${nr.type}" ${nr.cls?`data-cls="${nr.cls.id}"`:''}>${ic('play','sm')}Start reset</button>`}
  else if(!r.windDown&&!r.lightsOut){one=`Start wind-down at ${windStart()}. It adds 15 points tonight.`;btn=`<button class="btn sec block" data-act="tab-close" data-arg="sleep">Open Sleep</button>`}
  else if(!r.lightsOut){one=`Lights out by ${S.bedtime}. Rhythm is 40% of your score.`}
  else one='Today is done. Rest well and keep the same bedtime tomorrow.';
  h+=`<div class="panel pad gap12"><span class="label acc">One thing to lift it</span><p style="font-family:var(--f-ui);font-weight:600;font-size:19px;line-height:1.35;letter-spacing:-.015em">${esc(one)}</p>${btn}</div>`;
  h+=`<div class="gap8"><span class="label">How it works</span><p class="body2">Each day scores up to 100: Rhythm 40, Reset 30, Wind-down 15, Steadiness 15. Your Pausa Score is the average of the last 7 days, so one bad night moves it a little, never to zero. Grace Nights are left out, and coming back after a miss earns a bonus.</p><p class="note">${ic('info','xs')}Pausa Score reflects your habits, not a medical measurement. PAUSA does not measure sleep.</p></div>`;
  openSheet(h);
}

/* sprint ticker */
setInterval(()=>{const el=$('#sprint-time');if(el&&S.sprint){const left=S.sprint.start+S.sprint.dur-Date.now();if(left<=0){render(true);toast('Sprint complete. Time to reset.','sprint')}else el.textContent=fmtClock(left/1000)}},1000);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme()})}catch(e){}

/* ============ Boot ============ */
applyTheme();
lastDay=todayKey();
if(!S.onboarded){render();showOnb(0)}else{T();render()}
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
